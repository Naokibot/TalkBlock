name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build against Spigot 1.21.1 API
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Verify release jar
        run: |
          test -f target/TalkBlock-1.1.0-Spigot-1.21.1.jar
          unzip -t target/TalkBlock-1.1.0-Spigot-1.21.1.jar
          jar tf target/TalkBlock-1.1.0-Spigot-1.21.1.jar | grep '^config.yml$'
          jar tf target/TalkBlock-1.1.0-Spigot-1.21.1.jar | grep '^plugin.yml$'
          javap -classpath target/TalkBlock-1.1.0-Spigot-1.21.1.jar -verbose hahaha.talkblock.Talkblock | grep 'major version: 65'
      - uses: actions/upload-artifact@v4
        with:
          name: TalkBlock-1.1.0-Spigot-1.21.1
          path: target/TalkBlock-1.1.0-Spigot-1.21.1.jar
          if-no-files-found: error
